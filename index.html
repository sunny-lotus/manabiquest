<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学びクエスト</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#5a3a22,#2a1a10);font-family:"BIZ UDPGothic","Hiragino Sans","Meiryo",sans-serif;color:#3b2a1a}
.card{width:min(420px,calc(100% - 32px));background:#f8efd9;border:3px solid #c9a46a;border-radius:18px;padding:28px 24px;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
h1{margin:0 0 6px;font-size:30px;letter-spacing:.08em;color:#7a4b16}
p{margin:6px 0 18px;line-height:1.7}
input{width:100%;box-sizing:border-box;font-size:22px;padding:12px;border:2px solid #c9a46a;border-radius:12px;text-align:center;background:#fffdf6}
button{margin-top:14px;width:100%;font-size:20px;font-weight:700;padding:12px;border:0;border-radius:999px;background:#8a4b1e;color:#fff;cursor:pointer}
.portal-return{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:12px;color:#75451e;font-weight:700;text-decoration:underline}
.card{box-sizing:border-box}
#msg{min-height:1.6em;margin:12px 0 0;color:#b03a2e;font-weight:700}
</style></head><body>
<form class="card" id="f" autocomplete="off">
<h1>✦ 学びクエスト</h1>
<p>あいことばを入れて、<br>冒険の書をひらこう。</p>
<input id="pw" aria-label="あいことば" placeholder="あいことば">
<button type="submit">ひらく</button>
<div id="msg" role="status"></div>
<a class="portal-return" href="https://sunny-lotus.github.io/manabi-portal/">まなびひろばへ</a>
</form>
<script>
let D={"salt":"btPNt8irkYVYH9urJOZ6zA==","iv":"eTh1kjnw3TEidN5m","it":150000};
const K="manabiquest-aikotoba";
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  if(!D.ct){
    const response=await fetch('./game-base.html?v=c423a116');
    if(!response.ok)throw Error('ゲームを取得できませんでした');
    const packed=await response.text();
    D=JSON.parse(packed.match(/const D=(.*);/)[1]);
  }
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.salt),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const z=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.iv)},key,u8(D.ct));
  let html=await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const updateResponse=await fetch('./interface-update.json?v=20261102-three-party2');
  if(!updateResponse.ok)throw Error('画面を取得できませんでした');
  const update=await updateResponse.json();
  const updateBytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(update.iv)},key,u8(update.ct));
  const patch=JSON.parse(await new Response(new Blob([updateBytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  for(const [before,after] of patch.replacements){if(!html.includes(before))throw Error('更新形式が違います');html=html.replace(before,after);}
  html=html.replace('</style>',patch.css+'\n</style>');
  html=html.replace('/* adventure-runtime-end */',patch.code+'\n/* adventure-runtime-end */');
  try{localStorage.setItem(K,pw)}catch(e){}
  document.open();document.write(html);document.close();
}
const msg=document.getElementById("msg");
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault(); const pw=document.getElementById("pw").value.trim()
    .replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  msg.textContent="ひらいています…";
  try{ await open_(pw); }catch(err){ msg.textContent="あいことばがちがうよ。もう一度入れてね。"; }
});
(async()=>{ let s=null; try{s=localStorage.getItem(K)}catch(e){}
  if(s){ msg.textContent="ひらいています…"; try{ await open_(s); }catch(e){ msg.textContent=""; try{localStorage.removeItem(K)}catch(_){} } } })();
</script></body></html>
